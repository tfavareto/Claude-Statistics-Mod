<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc" fill="#F2F2F2"><title id="title">chat-status: the four sidebar sections</title><desc id="desc">State diagram of the chat-status mod. Four boxes: Working (Claude or its agents are running), Needs your answer (Claude asked a question or wants a permission), Waiting (the turn ended) and Paused (a section you create and drag chats into). Solid arrows are automatic: Working goes to Needs your answer when Claude asks you or shows a permission prompt, Working goes to Waiting when the turn ends, Waiting and Needs your answer go back to Working when you send a message, and Paused goes back to Working when you message a paused chat. Dashed arrows are done by you: you drag a chat from any section into Paused.</desc><style>text{font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.mu{fill:#9A9A9A}.dm{fill:#6E6E6E}.b{font-weight:600}.bb{font-weight:700}.i{font-style:italic}.px{shape-rendering:crispEdges}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1C1C"/><stop offset="1" stop-color="#232323"/></linearGradient></defs><rect width="1600" height="600" rx="24" fill="url(#bg)"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#8C8C8C"/></marker></defs><g class="bx bx0"><rect x="60" y="130" width="340" height="140" rx="12" fill="#242424" stroke="rgba(255,255,255,0.08)"/><rect x="78" y="128" width="304" height="4" rx="2" fill="#F2C94C"/><g class=""><circle cx="94" cy="174" r="10.35" fill="#F2C94C"/></g><text x="118" y="183" font-size="26" class="bb">Needs your answer</text><text x="90" y="222" font-size="22" class="mu">Claude asked a question</text><text x="90" y="252" font-size="22" class="mu">or wants a permission</text></g><g class="bx bx1"><rect x="630" y="130" width="340" height="140" rx="12" fill="#242424" stroke="rgba(255,255,255,0.08)"/><rect x="648" y="128" width="304" height="4" rx="2" fill="#3FB950"/><g class="ring"><circle cx="664" cy="174" r="10.35" fill="#3FB950"/></g><text x="688" y="183" font-size="26" class="bb">Working</text><text x="660" y="222" font-size="22" class="mu">Claude or its agents</text><text x="660" y="252" font-size="22" class="mu">are running</text></g><g class="bx bx2"><rect x="1200" y="130" width="340" height="140" rx="12" fill="#242424" stroke="rgba(255,255,255,0.08)"/><rect x="1218" y="128" width="304" height="4" rx="2" fill="#E8A33D"/><g class=""><path d="M1223.65,161.35H1244.35M1223.65,186.65H1244.35" stroke="#E8A33D" stroke-width="2.76" stroke-linecap="round"/><path d="M1226.53,161.35L1241.47,161.35L1235.38,174L1241.47,186.65L1226.53,186.65L1232.62,174Z" fill="none" stroke="#E8A33D" stroke-width="1.84" stroke-linejoin="round"/><path d="M1229.4,185.5L1238.6,185.5L1234,178.6Z" fill="#E8A33D"/></g><text x="1258" y="183" font-size="26" class="bb">Waiting</text><text x="1230" y="222" font-size="22" class="mu">The turn ended;</text><text x="1230" y="252" font-size="22" class="mu">it’s your move</text></g><g class="bx bx3"><rect x="630" y="400" width="340" height="140" rx="12" fill="#242424" stroke="rgba(255,255,255,0.08)"/><rect x="648" y="398" width="304" height="4" rx="2" fill="#4C8DF6"/><g class=""><rect x="652.5" y="432.5" width="23" height="23" rx="4.6" fill="#4C8DF6"/><rect x="658.825" y="437.675" width="3.45" height="12.65" rx="1" fill="#FFFFFF"/><rect x="665.725" y="437.675" width="3.45" height="12.65" rx="1" fill="#FFFFFF"/></g><text x="688" y="453" font-size="26" class="bb">Paused</text><text x="660" y="492" font-size="22" class="mu">A section you create</text><text x="660" y="522" font-size="22" class="mu">and drag chats into</text></g><path class="sa sa0" pathLength="1" d="M630,172C560,98 470,98 408,166" fill="none" stroke="#8C8C8C" stroke-width="2.5" marker-end="url(#ah)"/><path class="sa sa1" pathLength="1" d="M400,236H620" fill="none" stroke="#8C8C8C" stroke-width="2.5" marker-end="url(#ah)"/><path class="sa sa2" pathLength="1" d="M970,172C1040,98 1130,98 1192,166" fill="none" stroke="#8C8C8C" stroke-width="2.5" marker-end="url(#ah)"/><path class="sa sa3" pathLength="1" d="M1200,236H980" fill="none" stroke="#8C8C8C" stroke-width="2.5" marker-end="url(#ah)"/><path class="sa sa4" pathLength="1" d="M856,400V280" fill="none" stroke="#8C8C8C" stroke-width="2.5" marker-end="url(#ah)"/><path class="da" d="M744,270V390" fill="none" stroke="#8C8C8C" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#ah)"/><path class="da" d="M230,270C230,400 420,470 620,470" fill="none" stroke="#8C8C8C" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#ah)"/><path class="da" d="M1370,270C1370,400 1180,470 980,470" fill="none" stroke="#8C8C8C" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#ah)"/><g class="lb"><text x="515" y="62" font-size="22" text-anchor="middle" fill="#CFCFCF">Claude asks you /</text><text x="515" y="90" font-size="22" text-anchor="middle" fill="#CFCFCF">permission prompt</text><text x="1085" y="84" font-size="22" text-anchor="middle" fill="#CFCFCF">turn ends</text><text x="515" y="278" font-size="22" text-anchor="middle" fill="#CFCFCF">you send a message</text><text x="1085" y="278" font-size="22" text-anchor="middle" fill="#CFCFCF">you send a message</text><text x="728" y="344" font-size="22" text-anchor="end" fill="#CFCFCF">you drag it</text><text x="872" y="344" font-size="22" fill="#CFCFCF">you message a paused chat</text></g><path d="M560,577H610" fill="none" stroke="#8C8C8C" stroke-width="2.5"/><text x="622" y="584" font-size="22" class="mu">solid = automatic,</text><path d="M830,577H880" fill="none" stroke="#8C8C8C" stroke-width="2.5" stroke-dasharray="9 8"/><text x="892" y="584" font-size="22" class="mu">dashed = by you</text></svg>
