<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc" fill="#F2F2F2"><title id="title">usage-band: the usage meter above the prompt box</title><desc id="desc">A one-row band above the Claude prompt box. It reads 'Session' with a thin white bar at 12 percent and 'resets in 3h34', then 'Week' with a bar at 58 percent and 'resets in 4d 18h'. Below it, in dim italics: 'At this pace, the weekly limit runs out tomorrow night, before Sunday's reset.' Under the band is the empty prompt box with the placeholder 'Reply to Claude'.</desc><style>text{font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.mu{fill:#9A9A9A}.dm{fill:#6E6E6E}.b{font-weight:600}.bb{font-weight:700}.i{font-style:italic}.px{shape-rendering:crispEdges}@keyframes fb{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.fb{transform-box:fill-box;transform-origin:0 50%}.fb.g1{animation:fb 1.1s cubic-bezier(.3,0,.2,1) .3s both}.fb.g2{animation:fb 1.4s cubic-bezier(.3,0,.2,1) .5s both}@keyframes fade{0%{opacity:0}100%{opacity:1}}.pc.g1{animation:fade .6s 1.1s both}.pc.g2{animation:fade .6s 1.5s both}.lt{animation:fade 1s 2.2s both}@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}.caret{animation:caret 1.1s steps(1) infinite}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1C1C"/><stop offset="1" stop-color="#232323"/></linearGradient></defs><rect width="1600" height="360" rx="24" fill="url(#bg)"/><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D1D1D" stop-opacity="1"/><stop offset="1" stop-color="#1D1D1D" stop-opacity="0"/></linearGradient></defs><text x="184" y="52" font-size="24" fill="#8E8E8E">All 42 tests pass. Want me to open a pull request?</text><rect x="150" y="0" width="1300" height="44" fill="url(#fade)"/><text x="184" y="118" font-size="24" class="mu">Session</text><rect x="288" y="105" width="192" height="10" rx="5" fill="rgba(255,255,255,0.16)"/><rect x="288" y="105" width="23" height="10" rx="5" fill="#FFFFFF" class="fb g1"/><text x="496" y="118" font-size="24" class="b pc g1">12%</text><text x="556" y="118" font-size="24" class="mu pc g1">resets in 3h34</text><text x="820" y="118" font-size="24" class="mu">Week</text><rect x="902" y="105" width="192" height="10" rx="5" fill="rgba(255,255,255,0.16)"/><rect x="902" y="105" width="111.4" height="10" rx="5" fill="#FFFFFF" class="fb g2"/><text x="1110" y="118" font-size="24" class="b pc g2">58%</text><text x="1170" y="118" font-size="24" class="mu pc g2">resets in 4d 18h</text><text x="184" y="162" font-size="22" class="i lt" fill="#858585">At this pace, the weekly limit runs out tomorrow night, before Sunday’s reset.</text><rect x="160" y="188" width="1280" height="136" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/><rect class="caret" x="188" y="214" width="2.5" height="28" fill="#F2F2F2"/><text x="196" y="236" font-size="26" class="dm">Reply to Claude…</text><circle cx="204" cy="290" r="18" fill="none" stroke="#6E6E6E" stroke-width="2"/><path d="M204,281V299M195,290H213" stroke="#9A9A9A" stroke-width="2.2" stroke-linecap="round"/><circle cx="1400" cy="290" r="20" fill="#D97757"/><path d="M1400,300V280M1391,289L1400,280L1409,289" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
